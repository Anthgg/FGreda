# Cloud Build — FGreda (Frontend)
#
# Pipeline reproducible y auditable para despliegue en Cloud Run.
# El bundle se construye SIN incrustar la URL del backend.
#
# Desde Fase 009A.1, API_BASE_URL="" (mismo origen): el navegador llama a
# /api/v1/... en el propio origen de fgreda-web y es nginx quien reenvia
# /api/ al backend real (BACKEND_ORIGIN) — ver nginx/default.conf.template.
# Esto cierra D3 (WebKit/Safari bloqueaba las cookies de sesion en llamadas
# cross-site directas al dominio del backend).
#
# Ejecutar manualmente:
#   gcloud builds submit --config cloudbuild.yaml .

substitutions:
  _REGION: southamerica-west1
  _SERVICE: fgreda-web
  _IMAGE: southamerica-west1-docker.pkg.dev/cotizador-greda/cloud-run-source-deploy/fgreda-web
  # "" deliberado: mismo origen via el proxy de nginx (Fase 009A.1). Ver
  # nginx/docker-entrypoint.d/40-generate-runtime-config.sh.
  _API_BASE_URL: ""
  # Solo host (sin esquema): nginx antepone https:// en el location /api/.
  _BACKEND_ORIGIN: bgreda-api-303244958634.southamerica-west1.run.app
  # Los labels de GCP solo aceptan minusculas/numeros/guiones.
  _PHASE: "009a1"

steps:
  # ------------------------------------------------------------------
  # 1. Construir imagen etiquetada con SHA exacto
  #    Sin --build-arg VITE_API_BASE_URL: el bundle es generico.
  #    La URL se inyecta al arrancar el contenedor (runtime-config.js).
  # ------------------------------------------------------------------
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - build
      - --file=Dockerfile
      - --tag=$_IMAGE:$COMMIT_SHA
      - --tag=$_IMAGE:main-latest
      - --label=git-sha=$COMMIT_SHA
      - --label=repository=$REPO_NAME
      - --label=phase=$_PHASE
      - --cache-from=$_IMAGE:main-latest
      - .

  # ------------------------------------------------------------------
  # 2. Publicar imagen en Artifact Registry
  # ------------------------------------------------------------------
  - id: docker-push-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_IMAGE:$COMMIT_SHA
    waitFor:
      - docker-build

  - id: docker-push-alias
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_IMAGE:main-latest
    waitFor:
      - docker-build

  # ------------------------------------------------------------------
  # 3. Capturar revision actual (para rollback)
  # ------------------------------------------------------------------
  - id: capture-previous-revision
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euc
      - |
        PREV=$(gcloud run services describe $_SERVICE \
          --region=$_REGION \
          --project=$PROJECT_ID \
          --format="value(status.latestReadyRevisionName)")
        echo "PREVIOUS_REVISION=$$PREV" > /workspace/rollback.env
        echo "Revision anterior capturada: $$PREV"
    waitFor:
      - docker-push-sha

  # ------------------------------------------------------------------
  # 4. Desplegar nueva revision sin trafico todavia
  #    API_BASE_URL (vacia = mismo origen) y BACKEND_ORIGIN (destino real
  #    del proxy /api/ de nginx) se inyectan aqui como variables de entorno
  #    del contenedor.
  # ------------------------------------------------------------------
  - id: deploy-revision
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euc
      - |
        gcloud run deploy $_SERVICE \
          --image=$_IMAGE:$COMMIT_SHA \
          --region=$_REGION \
          --project=$PROJECT_ID \
          --no-traffic \
          --tag=p007-$SHORT_SHA \
          --set-env-vars="^|^API_BASE_URL=$_API_BASE_URL|BACKEND_ORIGIN=$_BACKEND_ORIGIN" \
          --update-labels=git-sha=$COMMIT_SHA,repository=fgreda,phase=$_PHASE
        echo "Revision desplegada sin trafico. Tag: p007-$SHORT_SHA"
    waitFor:
      - capture-previous-revision

  # ------------------------------------------------------------------
  # 5. Smoke sobre revision con tag (antes de mover trafico)
  # ------------------------------------------------------------------
  - id: smoke-tag-revision
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euc
      - |
        TAG_URL="https://p007-$SHORT_SHA---fgreda-web-ox6cywquca-tl.a.run.app"
        echo "Smoke sobre revision con tag: $$TAG_URL"

        # La SPA debe responder con 200
        HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$$TAG_URL/")
        echo "  /: HTTP $$HTTP_STATUS"
        if [ "$$HTTP_STATUS" != "200" ]; then
          echo "ERROR: la SPA no responde con 200 (got $$HTTP_STATUS)"
          exit 1
        fi

        # runtime-config.js debe existir y declarar API_BASE_URL="" (mismo
        # origen, Fase 009A.1) — no la URL absoluta del backend.
        BODY=$(curl -fsS --max-time 15 "$$TAG_URL/runtime-config.js")
        echo "  /runtime-config.js: $$(echo "$$BODY" | head -1)"
        if ! echo "$$BODY" | grep -q "__GREDA_CONFIG__"; then
          echo "ERROR: runtime-config.js no contiene __GREDA_CONFIG__"
          exit 1
        fi
        if ! echo "$$BODY" | grep -q '"API_BASE_URL": ""'; then
          echo "ERROR: runtime-config.js deberia declarar API_BASE_URL vacia (mismo origen)"
          exit 1
        fi

        # El proxy same-origin /api/ debe llegar al backend real: csrf es
        # publico y no requiere sesion, ideal para probar el reenvio sin
        # mutar nada. Si esto responde bien, D3 (WebKit) esta resuelto,
        # porque el navegador ya nunca necesita golpear el dominio del
        # backend directamente.
        API_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$$TAG_URL/api/v1/auth/csrf")
        echo "  /api/v1/auth/csrf (via proxy nginx): HTTP $$API_STATUS"
        if [ "$$API_STATUS" != "200" ]; then
          echo "ERROR: el proxy same-origin /api/ no llega al backend (got $$API_STATUS)"
          exit 1
        fi

        # La URL visible para el navegador debe ser la del propio frontend,
        # nunca la del backend — smoke basico de que no hay una redirect a
        # bgreda-api-*.run.app en el camino.
        API_EFFECTIVE_URL=$(curl -s -o /dev/null -w '%{url_effective}' --max-time 15 "$$TAG_URL/api/v1/auth/csrf")
        echo "  URL efectiva: $$API_EFFECTIVE_URL"
        if echo "$$API_EFFECTIVE_URL" | grep -q "bgreda-api"; then
          echo "ERROR: la request termino en el dominio del backend, no fue same-origin"
          exit 1
        fi

        echo "Smoke pre-traffic: PASS"
    waitFor:
      - deploy-revision

  # ------------------------------------------------------------------
  # 6. Mover 100% del trafico a la nueva revision
  # ------------------------------------------------------------------
  - id: update-traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euc
      - |
        NEW_REV=$(gcloud run revisions list \
          --service=$_SERVICE \
          --region=$_REGION \
          --project=$PROJECT_ID \
          --sort-by="~metadata.creationTimestamp" \
          --filter="metadata.labels.commit-sha=$COMMIT_SHA" \
          --format="value(metadata.name)" \
          --limit=1)
        if [ -z "$$NEW_REV" ]; then
          NEW_REV=$(gcloud run revisions list \
            --service=$_SERVICE \
            --region=$_REGION \
            --project=$PROJECT_ID \
            --sort-by="~metadata.creationTimestamp" \
            --format="value(metadata.name)" \
            --limit=1)
        fi
        echo "Moviendo 100% de trafico a: $$NEW_REV"
        gcloud run services update-traffic $_SERVICE \
          --region=$_REGION \
          --project=$PROJECT_ID \
          --to-revisions="$$NEW_REV=100"
        echo "NEW_REVISION=$$NEW_REV" >> /workspace/rollback.env
        echo "Trafico actualizado: $$NEW_REV = 100%"
    waitFor:
      - smoke-tag-revision

  # ------------------------------------------------------------------
  # 7. Smoke post-trafico (produccion real)
  # ------------------------------------------------------------------
  - id: smoke-production
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euc
      - |
        BASE="https://fgreda-web-303244958634.southamerica-west1.run.app"
        echo "Smoke en produccion: $$BASE"

        HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$$BASE/")
        echo "  /: HTTP $$HTTP_STATUS"
        test "$$HTTP_STATUS" = "200"

        CACHE=$(curl -sI --max-time 15 "$$BASE/runtime-config.js" | tr -d '\r' | grep -i cache-control || true)
        echo "  /runtime-config.js Cache-Control: $$CACHE"
        if ! echo "$$CACHE" | grep -qi "no-store"; then
          echo "WARN: Cache-Control no incluye no-store en runtime-config.js"
        fi

        API_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$$BASE/api/v1/auth/csrf")
        echo "  /api/v1/auth/csrf (via proxy nginx): HTTP $$API_STATUS"
        if [ "$$API_STATUS" != "200" ]; then
          echo "ERROR: el proxy same-origin /api/ no responde en produccion (got $$API_STATUS)"
          exit 1
        fi

        echo "Smoke produccion: PASS"
    waitFor:
      - update-traffic

# Imagen publicada
images:
  - $_IMAGE:$COMMIT_SHA
  - $_IMAGE:main-latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
