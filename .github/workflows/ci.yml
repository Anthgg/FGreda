name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Matriz completa (todos los navegadores + emulacion mobile) contra
    # produccion, una vez por semana. El job de Chromium en cada PR ya cubre
    # el camino critico en cada cambio; esto es solo para detectar drift
    # especifico de motor/viewport sin correrlo en cada push.
    - cron: "0 9 * * 1"

# Ningun paso lleva continue-on-error: un fallo real debe romper el pipeline.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        # npm ci falla si package-lock.json no coincide con package.json.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verificar que el bundle no contiene Supabase ni sesion local
        # Guarda de ultima linea sobre el artefacto realmente publicado.
        run: |
          for patron in supabase localStorage sessionStorage sb_publishable service_role; do
            if grep -rqi "$patron" dist/; then
              echo "El bundle contiene '$patron', lo cual viola la arquitectura del proyecto."
              exit 1
            fi
          done
          echo "Bundle limpio."

  docker:
    name: Imagen de contenedor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        # Sin --build-arg VITE_API_BASE_URL: el bundle es generico.
        # La URL del backend se inyecta al arrancar el contenedor (runtime-config.js).
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fgreda:ci

      - name: Verificar que el contenedor falla sin API_BASE_URL
        # El entrypoint debe salir con error si la variable no esta configurada.
        run: |
          EXIT_CODE=0
          docker run --rm \
            -e PORT=8080 \
            fgreda:ci || EXIT_CODE=$?
          echo "Exit code sin API_BASE_URL: $EXIT_CODE"
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "ERROR: El contenedor no deberia iniciar sin API_BASE_URL"
            exit 1
          fi
          echo "Fail-fast verificado: PASS"

      - name: Arrancar el contenedor con API_BASE_URL y comprobar que sirve la SPA
        # BACKEND_ORIGIN es obligatorio desde Fase 009A.1: nginx lo usa en
        # location /api/ (proxy_pass https://${BACKEND_ORIGIN}). Con un host
        # fijo (no una variable de nginx), proxy_pass lo resuelve por DNS al
        # ARRANCAR — nginx no inicia si no resuelve ("host not found in
        # upstream"), asi que hace falta un host real, aunque ningun test
        # de este job llame a /api/ de verdad. example.com (dominio de
        # prueba reservado por IANA, RFC 2606) siempre resuelve.
        run: |
          docker run -d --name fgreda-ci -p 8080:8080 \
            -e PORT=8080 \
            -e API_BASE_URL=http://test-backend-ci \
            -e BACKEND_ORIGIN=example.com \
            fgreda:ci
          for intento in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ -o /dev/null; then
              echo "Contenedor operativo"
              break
            fi
            sleep 2
          done
          if ! curl -fsS http://localhost:8080/ -o /dev/null; then
            echo "ERROR: El contenedor no respondio en el puerto 8080"
            echo "=== DOCKER LOGS ==="
            docker logs fgreda-ci
            exit 1
          fi

      - name: Verificar runtime-config.js — existencia y contenido
        run: |
          # Debe existir y devolver 200
          HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/runtime-config.js)
          echo "HTTP $HTTP_STATUS para /runtime-config.js"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: /runtime-config.js debe devolver 200 (got $HTTP_STATUS)"
            exit 1
          fi

          # Debe contener __GREDA_CONFIG__ con la URL inyectada
          BODY=$(curl -fsS http://localhost:8080/runtime-config.js)
          echo "Contenido: $BODY"
          if ! echo "$BODY" | grep -q "__GREDA_CONFIG__"; then
            echo "ERROR: runtime-config.js no contiene __GREDA_CONFIG__"
            exit 1
          fi
          if ! echo "$BODY" | grep -q "http://test-backend-ci"; then
            echo "ERROR: runtime-config.js no contiene la URL inyectada"
            exit 1
          fi
          echo "runtime-config.js: PASS"

      - name: Verificar que el proxy same-origin /api/ quedo bien configurado
        # No prueba conectividad real al backend (BACKEND_ORIGIN es un host
        # ficticio en este job) - verifica que envsubst sustituyo la
        # plantilla correctamente y que nginx arranco con ese location.
        run: |
          CONFIG=$(docker exec fgreda-ci cat /etc/nginx/conf.d/default.conf)
          if ! echo "$CONFIG" | grep -q "location /api/"; then
            echo "ERROR: falta el location /api/ en el nginx renderizado"
            exit 1
          fi
          if ! echo "$CONFIG" | grep -q "proxy_pass https://example.com"; then
            echo "ERROR: BACKEND_ORIGIN no se sustituyo en proxy_pass"
            exit 1
          fi
          if echo "$CONFIG" | grep -q '\${BACKEND_ORIGIN}'; then
            echo "ERROR: quedo un \${BACKEND_ORIGIN} literal sin sustituir"
            exit 1
          fi
          echo "Proxy /api/ same-origin: PASS"

      - name: Verificar Cache-Control no-store en runtime-config.js
        run: |
          CACHE=$(curl -sI http://localhost:8080/runtime-config.js | tr -d '\r' | grep -i cache-control || true)
          echo "Cache-Control: $CACHE"
          if ! echo "$CACHE" | grep -qi "no-store"; then
            echo "ERROR: Cache-Control debe incluir no-store para runtime-config.js"
            exit 1
          fi
          echo "Cache-Control no-store: PASS"

      - name: Comprobar el fallback de React Router
        # Una ruta profunda inexistente en disco debe devolver la SPA, no 404.
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/alguna/ruta/profunda)
          echo "HTTP $codigo"
          test "$codigo" = "200"

      - name: Comprobar las cabeceras de seguridad
        # nginx descarta los add_header heredados en cualquier location que
        # declare los suyos, asi que se verifican en las tres rutas posibles:
        # index.html, un asset con hash y el fallback de React Router.
        run: |
          for ruta in / /assets/ /una/ruta/profunda /runtime-config.js; do
            cabeceras=$(curl -sI "http://localhost:8080${ruta}")
            for esperada in "x-content-type-options: nosniff" "x-frame-options: DENY" "referrer-policy: same-origin"; do
              if ! echo "$cabeceras" | tr 'A-Z' 'a-z' | grep -q "$(echo "$esperada" | tr 'A-Z' 'a-z')"; then
                echo "Falta '$esperada' en $ruta"
                echo "$cabeceras"
                exit 1
              fi
            done
            echo "$ruta: cabeceras de seguridad presentes"
          done

      - name: Comprobar que el proceso no corre como root
        run: |
          uid=$(docker exec fgreda-ci id -u)
          echo "UID del proceso: $uid"
          test "$uid" != "0"

      - name: Detener el contenedor
        if: always()
        run: docker rm -f fgreda-ci || true

  deploy-scripts-lint:
    name: Validar configuracion Cloud Build y scripts de deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar cloudbuild.yaml — campos requeridos
        run: |
          python3 - <<'PYEOF'
          import sys
          import yaml

          configs = {
              "cloudbuild.yaml": ["steps", "images", "options", "timeout"],
          }

          errors = []
          for filename, required_keys in configs.items():
              try:
                  with open(filename, "r") as f:
                      data = yaml.safe_load(f)
              except FileNotFoundError:
                  errors.append(f"{filename}: archivo no encontrado")
                  continue
              except yaml.YAMLError as e:
                  errors.append(f"{filename}: YAML invalido — {e}")
                  continue

              for key in required_keys:
                  if key not in data:
                      errors.append(f"{filename}: falta campo requerido '{key}'")

              steps = data.get("steps", [])
              for i, step in enumerate(steps):
                  if "name" not in step:
                      errors.append(f"{filename}: step[{i}] sin 'name'")
                  if "args" not in step and "entrypoint" not in step:
                      errors.append(f"{filename}: step[{i}] sin 'args' ni 'entrypoint'")

              # Verificar que NO contiene VITE_API_BASE_URL como build-arg en steps
              raw = yaml.dump(data)
              if "VITE_API_BASE_URL" in raw and "build-arg" in raw:
                  errors.append(
                      f"{filename}: contiene --build-arg VITE_API_BASE_URL. "
                      "La URL debe inyectarse en runtime, no en build-time."
                  )

              print(f"  {filename}: OK ({len(steps)} steps)")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          print("Configuracion Cloud Build: valida")
          PYEOF

      - name: Verificar scripts de deploy — sintaxis bash
        run: |
          for script in scripts/deploy-frontend.sh; do
            if [ ! -f "$script" ]; then
              echo "ERROR: $script no encontrado"
              exit 1
            fi
            bash -n "$script" && echo "  $script: sintaxis OK"
          done

      - name: Verificar 40-generate-runtime-config.sh — sintaxis sh
        run: |
          script="nginx/docker-entrypoint.d/40-generate-runtime-config.sh"
          if [ ! -f "$script" ]; then
            echo "ERROR: $script no encontrado"
            exit 1
          fi
          sh -n "$script" && echo "  $script: sintaxis OK"

  playwright-e2e:
    name: Smoke de produccion (Chromium)
    # SMOKE DE PRODUCCION, no validacion de la PR. Corre contra el ambiente
    # desplegado (por defecto, produccion) y por eso NO puede validar una rama:
    # prueba lo que ya esta desplegado, no lo que trae el cambio. Las pruebas
    # funcionales de una rama viven en e2e/revision/, que esta configuracion
    # ignora, y las valida el job «E2E de la revision» de abajo.
    #
    # Hasta la Fase 010G se llamaba «Playwright E2E (Chromium)» y parecia un
    # gate de la PR. Sin secrets de produccion se omite entero y sale en verde
    # sin ejecutar nada, que es justo como se leyo mal.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar credenciales de prueba
        # Sin E2E_EMAIL/E2E_PASSWORD como secrets del repo, la corrida se
        # omite (no bloquea el PR) en vez de fallar en falso. Ninguna
        # credencial se inventa ni se imprime.
        id: creds
        run: |
          if [ -z "${{ secrets.E2E_EMAIL }}" ] || [ -z "${{ secrets.E2E_PASSWORD }}" ]; then
            # Aviso visible y no solo un eco: un job omitido que sale en verde
            # se lee como «pasaron las E2E», y aqui no se ejecuto ninguna.
            echo "::warning title=Smoke de produccion omitido::Sin E2E_EMAIL/E2E_PASSWORD no se ejecuto ninguna prueba contra produccion. Este verde no valida nada."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Chromium (Playwright)
        if: steps.creds.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright (chromium)
        if: steps.creds.outputs.ready == 'true'
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test --project=chromium

      - name: Subir reporte HTML
        if: always() && steps.creds.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-revision:
    name: E2E de la revision (Chromium)
    # Fase 010G. Las pruebas funcionales de una rama se ejecutan contra la
    # aplicacion CONSTRUIDA DESDE ESA RAMA, hablando con un backend levantado
    # desde la revision compatible sobre un PostgreSQL efimero. Nada de esto toca
    # produccion: ni la app, ni la base, ni la autenticacion.
    #
    # - frontend: `npm run build` de este checkout, servido con `vite preview`
    #   en :4173; `/api` lo reenvia a :8000 el proxy de vite.config.ts, asi que
    #   las cookies son del mismo origen, como en produccion con nginx;
    # - backend: checkout de Anthgg/BGreda en BACKEND_REF, `alembic upgrade head`
    #   y `tests/e2e/servidor_revision.py`, que siembra lo minimo por la API y
    #   autentica con los dobles de las pruebas de base de datos;
    # - credenciales: aleatorias en cada corrida, contra esa autenticacion
    #   simulada. No hay secretos que puedan faltar, asi que este job NUNCA se
    #   omite: si el entorno no levanta, falla.
    #
    # Sin reintentos y sin continue-on-error: un gate que pasa a la segunda
    # esconde justo la intermitencia que tendria que ensenar.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Revision del backend contra la que se prueba. Tiene que CONTENER lo que
      # la rama del frontend necesita; el job imprime el SHA exacto que uso.
      BACKEND_REF: feat/phase-010g-e2e-revision
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: greda
          POSTGRES_PASSWORD: greda
          POSTGRES_DB: greda_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout del frontend (esta revision)
        uses: actions/checkout@v4

      - name: Checkout del backend (BACKEND_REF)
        uses: actions/checkout@v4
        with:
          repository: Anthgg/BGreda
          ref: ${{ env.BACKEND_REF }}
          path: backend

      - name: Revisiones que se prueban
        run: |
          FRONT="$(git rev-parse HEAD)"
          BACK="$(git -C backend rev-parse HEAD)"
          echo "Frontend: $FRONT"
          echo "Backend:  $BACK ($BACKEND_REF)"
          {
            echo "### E2E de la revision"
            echo "- Frontend: $FRONT"
            echo "- Backend: $BACK ($BACKEND_REF)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Dependencias del backend
        working-directory: backend
        run: uv sync --frozen --python 3.12

      - name: Migraciones hasta la cabeza
        working-directory: backend
        env:
          DATABASE_URL: postgresql://greda:greda@localhost:5432/greda_e2e
        run: uv run alembic upgrade head

      - name: Credenciales aleatorias de la corrida
        run: |
          EMAIL="e2e-$(openssl rand -hex 4)@example.com"
          CLAVE="$(openssl rand -hex 24)"
          echo "::add-mask::$CLAVE"
          echo "E2E_EMAIL=$EMAIL" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$CLAVE" >> "$GITHUB_ENV"

      - name: Levantar el backend de la revision
        working-directory: backend
        env:
          GREDA_E2E_REVISION: "1"
          DATABASE_URL: postgresql://greda:greda@localhost:5432/greda_e2e
          FRONTEND_ORIGINS: http://localhost:4173
          COOKIE_SECURE: "false"
        # Con el Python del entorno y NO con `uv run`: `uv run` retiene el
        # bloqueo de la cache de uv mientras vive, y el paso posterior de
        # setup-uv («Pruning cache...») se quedaba cinco minutos esperandolo y
        # fallaba con codigo 2 cuando las E2E ya habian pasado.
        run: |
          # `setsid` le da su PROPIO grupo de procesos: el PID guardado es el del
          # grupo, y el apagado puede matar exactamente eso y nada mas.
          setsid nohup .venv/bin/python -m tests.e2e.servidor_revision --port 8000 > ../backend.log 2>&1 < /dev/null &
          echo $! > ../backend.pid
          for intento in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/auth/csrf -o /dev/null; then
              echo "Backend de la revision operativo"
              grep "siembra completa" ../backend.log
              exit 0
            fi
            sleep 2
          done
          echo "El backend no respondio"
          cat ../backend.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias del frontend
        run: npm ci

      - name: Construir el frontend de esta revision
        # Mismo origen que `vite preview`: /api lo reenvia su proxy al backend.
        env:
          VITE_API_BASE_URL: http://localhost:4173
        run: npm run build

      - name: Servir la app construida
        run: |
          # Grupo propio tambien aqui: `npx` lanza a `node` como hijo, y matar
          # solo a `npx` dejaba vivo el servidor.
          setsid nohup npx vite preview --port 4173 --strictPort --host 127.0.0.1 > preview.log 2>&1 < /dev/null &
          echo $! > preview.pid
          for intento in $(seq 1 30); do
            if curl -fsS http://localhost:4173/ -o /dev/null && curl -fsS http://localhost:4173/api/v1/auth/csrf -o /dev/null; then
              echo "App y proxy /api operativos"
              exit 0
            fi
            sleep 2
          done
          echo "La app no respondio"
          cat preview.log
          exit 1

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: E2E de la revision
        env:
          E2E_BASE_URL: http://localhost:4173
        run: npx playwright test -c playwright.revision.config.ts

      - name: Apagar backend y app
        # Siempre, pase lo que pase arriba: un proceso que sobrevive al ultimo
        # paso se queda con puertos, ficheros y la cache de uv, y el fallo
        # aparece despues en un paso de limpieza que no tiene nada que ver.
        if: always()
        # Mata SOLO los grupos que este job creo, por su PID guardado; nada de
        # `pkill` por patron, que podria alcanzar un proceso ajeno. Es un paso
        # aparte del de Playwright: si las E2E fallan, ese paso ya ha puesto el
        # job en rojo y esto no lo cambia; si pasan, este paso solo puede ponerlo
        # en rojo por una razon real, que quede algo vivo.
        run: |
          quedan=0
          for fichero in backend.pid preview.pid; do
            [ -f "$fichero" ] || continue
            grupo="$(cat "$fichero")"
            kill -TERM -- "-$grupo" 2>/dev/null || true
            for intento in $(seq 1 10); do
              kill -0 -- "-$grupo" 2>/dev/null || break
              sleep 1
            done
            if kill -0 -- "-$grupo" 2>/dev/null; then
              kill -KILL -- "-$grupo" 2>/dev/null || true
              sleep 1
            fi
            if kill -0 -- "-$grupo" 2>/dev/null; then
              echo "Sigue vivo el grupo $grupo ($fichero):"
              ps -o pid,pgid,cmd -g "$grupo" || true
              quedan=1
            fi
          done
          [ "$quedan" -eq 0 ] || exit 1
          echo "Backend y app apagados"

      - name: Reporte y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-revision
          path: |
            playwright-report-revision/
            test-results/
            backend.log
            preview.log
          retention-days: 7

  playwright-e2e-full-matrix:
    name: Playwright E2E (matriz completa)
    # Manual (workflow_dispatch) o programado semanalmente; nunca en cada PR
    # porque cubre WebKit y emulacion mobile-ios/mobile-android ademas de
    # Chromium/Firefox, y es mucho mas lento que el job de arriba.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-ios, mobile-android]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar credenciales de prueba
        id: creds
        run: |
          if [ -z "${{ secrets.E2E_EMAIL }}" ] || [ -z "${{ secrets.E2E_PASSWORD }}" ]; then
            echo "E2E_EMAIL/E2E_PASSWORD no configurados: se omite esta corrida."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar navegadores (Playwright)
        if: steps.creds.outputs.ready == 'true'
        run: npx playwright install --with-deps

      - name: "Playwright (${{ matrix.project }})"
        if: steps.creds.outputs.ready == 'true'
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test --project=${{ matrix.project }}

      - name: "Subir reporte HTML (${{ matrix.project }})"
        if: always() && steps.creds.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
