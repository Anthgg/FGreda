# Cabeceras de seguridad de la SPA.
#
# Van en un fichero aparte porque nginx NO hereda `add_header` hacia un bloque
# `location` que declara el suyo propio: los del padre se descartan por
# completo. Cada location que anada cabeceras debe incluir este fichero, o las
# de seguridad desaparecen silenciosamente.
#
# `always` hace que se emitan tambien en respuestas de error.

add_header X-Content-Type-Options "nosniff"     always;
add_header X-Frame-Options        "DENY"        always;
add_header Referrer-Policy        "same-origin" always;
